name: Release
# Test changes in the fork; publishing still requires an explicit v* tag.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build python3-pil
      - run: cmake -S . -B build/host -G Ninja && cmake --build build/host -j4
      - run: ctest --test-dir build/host --output-on-failure
      - run: python3 tools/test_jpegsw.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check out the compatible Hachidori relay test server
        uses: actions/checkout@v4
        with:
          repository: bee-san/hachidori-anki
          # v0.0.5, pinned so the HTTP contract test cannot drift.
          ref: beffaca1cab2584608a25c276d81b17b0f27088f
          path: .refs/hachidori-anki
      - name: Test the CLI through the real relay HTTP API
        run: node --test tools/test_hachidori_relay.mjs

  vita:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: vitasdk/vitasdk:2026.08
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends g++ patch python3
      - run: WORK=$PWD/.refs/toolchain bash tools/setup_toolchain.sh
      - run: |
          export PATH=$PWD/.refs/toolchain/psp2cxml-tool/mbuild:$PATH
          cmake -S vita -B build/vita -DCMAKE_BUILD_TYPE=Release -DVJO_TEXT_TEST_APP=ON && cmake --build build/vita -j4 && cmake --build build/vita --target release
      - uses: actions/upload-artifact@v4
        with:
          name: VitaJPOverlay
          path: build/vita/VitaJPOverlay-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Native-text-self-test
          path: build/vita/vjo-hook-test.vpk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host, vita]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VitaJPOverlay
      - uses: softprops/action-gh-release@v2
        with:
          files: VitaJPOverlay-*.zip
