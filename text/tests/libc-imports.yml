# Aliases force real retail SceLibc imports instead of VitaSDK newlib's local
# memcpy/strcpy implementations. NIDs: pinned vita-headers db/360/SceLibc.yml.
version: 2
firmware: 3.60
modules:
  SceLibc:
    nid: 0x43FBA801
    libraries:
      SceLibc:
        kernel: false
        nid: 0xBE43BB07
        functions:
          vjo_test_libc_memcpy: 0x7205BFDB
          vjo_test_libc_strcpy: 0x85B924B7
          vjo_test_libc_strncpy: 0x9F87712D
          vjo_test_libc_memmove: 0xAF5C218D
